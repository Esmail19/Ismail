<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 13px;background:var(--wine);color:white;cursor:pointer}button.alt{background:white;color:var(--wine);border:1px solid var(--line)}button.gold{background:var(--gold);color:#30272a}header{background:var(--wine);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header b{font-size:22px}.layout{display:grid;grid-template-columns:190px 1fr;min-height:90vh}aside{padding:10px;background:#fffaf4}nav{display:grid;gap:5px;position:sticky;top:8px}nav button{background:transparent;color:var(--wine);text-align:right}nav button.on{background:#eee2dc}main{padding:18px;max-width:1400px;width:100%;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.muted{color:#81777a;font-size:12px}.num{font-size:24px;font-weight:bold;color:var(--wine);margin-top:8px}.field{display:grid;gap:5px;margin:8px 0}.field input,.field select,.field textarea,input.search{width:100%;padding:10px;border:1px solid #d9ccc3;border-radius:8px;background:white}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}td,th{text-align:right;padding:9px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f5ece4;color:var(--wine)}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.dialog{background:var(--paper);border-radius:12px;padding:18px;width:min(800px,100%);max-height:94vh;overflow:auto}.alert{padding:10px;background:#fff2d8;border-right:4px solid var(--gold);margin:7px 0;border-radius:7px}.pill{background:#eee2dc;padding:4px 8px;border-radius:20px;font-size:12px}.photo{width:55px;height:55px;object-fit:cover;border-radius:6px}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:20px;color:#81777a}.danger{background:var(--red)}footer{text-align:center;padding:15px;color:#81777a;font-size:12px}

.card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}.card.clickable:active{transform:scale(.98);box-shadow:0 0 0 2px var(--gold)}
.booking-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 3px 12px #3320270b}.booking-card h3{margin:0 0 8px;color:var(--wine)}.booking-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;font-size:13px}.booking-meta span{background:#f6f0ea;padding:7px;border-radius:8px}.booking-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.alert{cursor:pointer;border-right:4px solid var(--gold);padding:10px;margin:7px 0;background:#f7f0e8;border-radius:9px}

.dress-photo{min-width:0;min-height:150px;border-radius:11px;overflow:hidden;background:#f1e9e2;display:flex;align-items:center;justify-content:center}

.dress-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.dress-actions button{flex:1;min-width:85px}
@media(max-width:680px){
 body{padding-bottom:calc(125px + env(safe-area-inset-bottom))}
 main{padding:10px 10px calc(145px + env(safe-area-inset-bottom))}
 .dress-list{grid-template-columns:1fr;gap:11px}

 .dress-photo,.dress-photo img{min-height:138px}

\n:root{--wine:#35151f;--gold:#c9a96e;--bg:#f4efe9;--paper:#fffdfa;--ink:#2b2024;--line:#e4d8ce}\nbutton,.card.clickable{transition:transform .14s ease,box-shadow .14s ease,background .14s ease}button:active,.card.clickable:active{transform:scale(.975);box-shadow:0 0 0 2px #c9a96e66}\n.modal{z-index:100;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.dialog{position:relative;padding-top:48px;box-shadow:0 18px 60px #160b0f55}.modal-x{position:absolute;top:9px;left:10px;width:36px;height:36px;padding:0;font-size:25px;line-height:1;border-radius:50%;z-index:2}\n.dress-card,.booking-card,.panel,.card{overflow-wrap:break-word;word-break:normal}.dress-title h3,.dress-details b{overflow-wrap:break-word;word-break:normal;hyphens:none}.stat-hint{font-size:11px;color:#9a7b49;margin-top:7px}\n@media(max-width:680px){body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}.layout>aside{background:linear-gradient(180deg,#49202d,#28131b);border-top:1px solid #c9a96e;box-shadow:0 -6px 24px #1d101533;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#f6ece4;font-size:10px;padding:5px 1px;min-height:49px}nav button span{font-size:18px;line-height:1.1}nav button small{font-size:9px}nav button.on{background:#75505b;color:#e6c98e;box-shadow:inset 0 -2px #c9a96e}main{padding-bottom:calc(130px + env(safe-area-inset-bottom))}.dress-card{grid-template-columns:92px minmax(0,1fr)}.dress-actions button{min-width:75px;font-size:12px}}\n

button,.card,.panel,.alert,.notice{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}

<body>
<header><div><b id="brand">Ismail Atelier</b><div class="muted" style="color:#eee">إدارة الأتيليه</div></div></header>
<div class="layout"><aside><nav id="nav">
<button class="on" data-p="home"><span>⌂</span><small>الرئيسية</small></button><button data-p="dresses"><span>♕</span><small>الفساتين</small></button><button data-p="bookings"><span>▣</span><small>الحجوزات</small></button><button data-p="clients"><span>♙</span><small>العميلات</small></button><button data-p="money"><span>◈</span><small>الحسابات</small></button><button data-p="reports"><span>▤</span><small>التقارير</small></button><button data-p="settings"><span>⚙</span><small>الإعدادات</small></button>
</nav></aside><main id="app"></main></div><footer>البيانات محفوظة محليًا على هذا الجهاز — احتفظ بنسخة احتياطية دورية</footer>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
"use strict";
const DB="IsmailAtelierLocal",STORE="main";let db,data,page="home",storageReady=false;
const $=x=>document.getElementById(x),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const fmt=n=>new Intl.NumberFormat("ar-EG",{maximumFractionDigits:2}).format(+n||0)+" ج.م";
const dt=s=>s?new Date(s+"T12:00:00").toLocaleDateString("ar-EG"):"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fresh=()=>({version:3,settings:{name:"Ismail",phone:"",address:"",openingCash:0,openingBank:0,invoiceTerms:"يرجى الالتزام بمواعيد الاستلام والإرجاع والمحافظة على الفستان."},dresses:[],clients:[],bookings:[],payments:[],expenses:[],audit:[]});
function migrate(x){let d={...fresh(),...(x||{})};for(let k of ["dresses","clients","bookings","payments","expenses","audit"])if(!Array.isArray(d[k]))d[k]=[];d.settings={...fresh().settings,...(d.settings||{})};d.dresses=d.dresses.map(x=>({...x,images:Array.isArray(x.images)?x.images:(x.image?[x.image]:[]),fabric:Number(x.fabric)||0,buy:Number(x.buy)||0,workmanship:Math.max(0,(Number(x.buy)||0)-(Number(x.fabric)||0))}));d.bookings=d.bookings.map(b=>({...b,paymentStatus:b.paymentStatus||"",returnCheck:b.returnCheck||"",extraCharges:Array.isArray(b.extraCharges)?b.extraCharges:[]}));let seq=Math.max(0,Number.isSafeInteger(Number(d.bookingSequence))?Number(d.bookingSequence):0);for(const b of d.bookings){let m=/^H(\d+)$/.exec(String(b.number||""));if(m)seq=Math.max(seq,Number(m[1]));}let missing=d.bookings.filter(b=>!/^H\d+$/.test(String(b.number||""))).sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||""))||String(a.id||"").localeCompare(String(b.id||"")));for(const b of missing){seq++;b.number="H"+String(seq).padStart(3,"0");}d.bookingSequence=seq;d.version=3;return d}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,4);r.onupgradeneeded=()=>{let x=r.result;if(!x.objectStoreNames.contains(STORE))x.createObjectStore(STORE)};r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();res(r.result)};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("قاعدة البيانات مفتوحة في تبويب آخر"))})}
function getDB(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get("data");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function save(){if(!db||!storageReady)throw new Error("التخزين المحلي غير جاهز؛ لم يتم حفظ التعديل");return new Promise((res,rej)=>{let t;try{t=db.transaction(STORE,"readwrite",{durability:"strict"})}catch(_){t=db.transaction(STORE,"readwrite")}t.objectStore(STORE).put(data,"data");t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error||new Error("فشل الحفظ"));t.onabort=()=>rej(t.error||new Error("تم إلغاء الحفظ"))})}
function log(action,kind,id){data.audit.unshift({action,kind,id,at:new Date().toISOString()});}
async function start(){try{db=await openDB();try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(_){}let x=await getDB();if(x){data=migrate(x);storageReady=true;await save()}else{let legacy=null;for(const k of ["ismail_local_backup","ismail_atelier_v2","ismail_atelier_v3"]){try{let raw=localStorage.getItem(k);if(raw){legacy=JSON.parse(raw);if(legacy)break}}catch(_){}}data=migrate(legacy);storageReady=true;await save();if(legacy){for(const k of ["ismail_local_backup","ismail_atelier_v2","ismail_atelier_v3"]){try{localStorage.removeItem(k)}catch(_){}}}}if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{})}}catch(e){storageReady=false;data=migrate(null);alert("تعذر فتح قاعدة البيانات المحلية. لم يتم تفعيل وضع حفظ وهمي؛ لا تدخل بيانات قبل حل مشكلة التخزين. حدّث الصفحة أو افتحها من Safari عبر HTTPS.")}$("brand").textContent=data.settings.name||"Ismail";render()}
function modal(s){$("dialog").innerHTML='<button type="button" class="modal-x alt" aria-label="إغلاق" onclick="closeModal()">×</button>'+s;$("modal").classList.add("show")}function closeModal(){ $("modal").classList.remove("show")}document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
$("nav").onclick=e=>{let b=e.target.closest("[data-p]");if(b){page=b.dataset.p;render()}};
function header(t){return `<div class="row" style="justify-content:space-between"><h2>${t}</h2><input class="search" style="max-width:240px" placeholder="بحث..." oninput="searchAll(this.value)"></div>`}
function render(){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===page));let f={home, dresses,bookings,clients,money,reports,settings}[page];$("app").innerHTML=f()}
function totalPaid(b){return data.payments.filter(p=>p.bookingId===b.id&&(p.type==="دفعة"||p.type==="استرداد")).reduce((s,p)=>s+(p.type==="استرداد"?-p.amount:p.amount),0)}
function insuranceReceived(b){return data.payments.filter(p=>p.bookingId===b.id&&p.type==="استلام تأمين").reduce((s,p)=>s+(+p.amount||0),0)}
function insuranceRefunded(b){return data.payments.filter(p=>p.bookingId===b.id&&p.type==="رد تأمين").reduce((s,p)=>s+(+p.amount||0),0)}
function insuranceBalance(b){return Math.max(0,insuranceReceived(b)-insuranceRefunded(b))}
async function recordInsuranceReceipt(id){let b=data.bookings.find(x=>x.id===id);if(!b)return;let amount=Math.max(0,(+b.security||0)-insuranceReceived(b));if(amount<=0){alert("التأمين مسجل بالكامل بالفعل");return}if(!confirm("تسجيل استلام تأمين بقيمة "+fmt(amount)+"؟"))return;data.payments.unshift({id:uid(),bookingId:id,amount,type:"استلام تأمين",method:"نقدي",date:today(),note:"تسجيل تأمين سابق"});log("استلام تأمين","حجز",id);await save();bookingView(id)}
function remaining(b){return (+b.rent||0)+(Array.isArray(b.extraCharges)?b.extraCharges.reduce((s,x)=>s+(+x.amount||0),0):0)-totalPaid(b)}
function home(){
let bs=data.bookings.filter(b=>b.status!=="ملغي"),t=today(),tomorrow=()=>{let d=new Date();d.setDate(d.getDate()+1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")},tm=tomorrow(),alerts=[];
const add=(level,title,b,detail)=>alerts.push({level,title,b,detail});
for(const b of bs){
 const dress=data.dresses.find(d=>d.id===b.dressId),due=remaining(b);
 if(b.delivery===t&&b.status!=="تم التسليم للعميلة")add("عاجل","تسليم اليوم",b,"موعد تسليم الفستان للعميلة اليوم");
 else if(b.delivery===tm&&b.status!=="تم التسليم للعميلة")add("مهم","تسليم غدًا",b,"استعد لتسليم الفستان غدًا");
 if(b.returnDate&&b.returnDate<t&&!["تم الإرجاع","مكتمل"].includes(b.status))add("عاجل","إرجاع متأخر",b,"تجاوز موعد الإرجاع ولم يتم تسجيل الاستلام");
 else if(b.returnDate===t&&!["تم الإرجاع","مكتمل"].includes(b.status))add("عاجل","إرجاع اليوم",b,"موعد رجوع الفستان اليوم");
 else if(b.returnDate===tm&&!["تم الإرجاع","مكتمل"].includes(b.status))add("مهم","إرجاع غدًا",b,"تأكد من موعد رجوع الفستان");
 if(b.prep&&b.prep<=tm&&b.status!=="تم التسليم للعميلة"&&!["تم الإرجاع","مكتمل","ملغي"].includes(b.status)&&["جديد","مؤكد"].includes(b.status))add(b.prep<t?"عاجل":"مهم",b.prep<t?"تجهيز متأخر":"موعد تجهيز قريب",b,"موعد تجهيز الأتيليه: "+dt(b.prep));
 if(due>0&&b.delivery<=tm&&!["تم التسليم للعميلة","تم الإرجاع","مكتمل"].includes(b.status))add("مهم","مبلغ متبقٍ قبل التسليم",b,"المتبقي: "+fmt(due));
 if(dress&&["صيانة","في المغسلة","تلف","تحت التجهيز"].includes(dress.status)&&b.delivery<=tm&&!["تم التسليم للعميلة","تم الإرجاع","مكتمل","ملغي"].includes(b.status))add("عاجل","الفستان غير جاهز",b,"حالة الفستان الحالية: "+dress.status);
}
let seen=new Set();alerts=alerts.filter(a=>{let k=a.title+"|"+a.b.id;if(seen.has(k))return false;seen.add(k);return true});
let urgent=alerts.filter(a=>a.level==="عاجل").length,important=alerts.filter(a=>a.level==="مهم").length;
let alertHtml=alerts.map(a=>`<div class="alert" style="border-right-color:${a.level==="عاجل"?"#a33d43":"#c5a46d"}" onclick="bookingView('${a.b.id}')"><b>${a.level==="عاجل"?"🔴":"🟡"} ${esc(a.title)} — ${esc(a.b.number)}</b><div>${esc(a.b.client)} — ${esc(a.b.dressName)}</div><small>${esc(a.detail)}</small></div>`).join("");
let received=data.payments.filter(p=>p.type!=="استرداد"&&p.type!=="رد تأمين").reduce((s,p)=>s+(+p.amount||0),0),spent=data.expenses.reduce((s,e)=>s+(+e.amount||0),0);
return header("الرئيسية")+`<div class="grid">${stat("عدد الفساتين",data.dresses.filter(d=>!d.archived).length)}${stat("الحجوزات النشطة",bs.length)}${stat("المقبوضات",fmt(received))}${stat("المصروفات",fmt(spent))}${stat("المتبقي",fmt(bs.reduce((s,b)=>s+Math.max(0,remaining(b)),0)))}${stat("صافي الحركة",fmt(received-spent))}</div><section class="panel"><h3>التنبيهات الذكية <span class="pill">عاجل: ${urgent} | مهم: ${important}</span></h3>${alertHtml||'<div class="empty">لا توجد تنبيهات تحتاج إلى إجراء حاليًا</div>'}</section><div class="row"><button onclick="dressForm()">إضافة فستان</button><button onclick="bookingForm()">حجز جديد</button><button onclick="clientForm()">إضافة عميلة</button></div>`}

function imageData(file){return new Promise((res,rej)=>{if(!file||!file.type||!file.type.startsWith("image/"))return rej(new Error("الملف المختار ليس صورة"));if(file.size>12*1024*1024)return rej(new Error("حجم الصورة أكبر من 12 ميجابايت؛ اختر صورة أصغر"));let r=new FileReader();r.onerror=()=>rej(new Error("تعذرت قراءة الصورة"));r.onload=()=>{let im=new Image();im.onload=()=>{try{let c=document.createElement("canvas"),s=Math.min(1,1200/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));let ctx=c.getContext("2d");if(!ctx)throw new Error("تعذر تجهيز الصورة");ctx.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))}catch(e){rej(e)}};im.onerror=()=>rej(new Error("صيغة الصورة غير مدعومة أو الصورة تالفة"));im.src=r.result};r.readAsDataURL(file)})}

function paymentForm(id){let b=data.bookings.find(x=>x.id===id);modal(`<h3>تسجيل حركة مالية</h3><p>المتبقي الحالي: ${fmt(remaining(b))}</p><form id="pf">${field("المبلغ","amount","",true,"number")}<div class="field"><label>نوع الحركة</label><select name="type"><option>دفعة</option><option>استرداد</option></select></div><div class="field"><label>طريقة الدفع</label><select name="method"><option>نقدي</option><option>تحويل</option><option>بطاقة</option></select></div>${field("التاريخ","date",today(),true,"date")}<button>حفظ الحركة</button></form>`);$("pf").onsubmit=async e=>{e.preventDefault();let v=new FormData(e.target),amount=+v.get("amount");if(amount<=0){alert("أدخل مبلغًا صحيحًا");return}if(v.get("type")==="استرداد"&&amount>Math.max(0,totalPaid(b))){alert("قيمة الاسترداد أكبر من صافي المبلغ المحصل من هذا الحجز");return}if(v.get("type")==="دفعة"&&amount>Math.max(0,remaining(b))){if(!confirm("المبلغ أكبر من المتبقي. هل تريد الاستمرار؟"))return}data.payments.unshift({id:uid(),bookingId:id,amount,type:v.get("type"),method:v.get("method"),date:v.get("date"),createdAt:new Date().toISOString()});log(v.get("type"),"حركة مالية",id);await save();closeModal();render()}}
function paymentFlow(method){return data.payments.filter(p=>p.method===method).reduce((s,p)=>s+(["استرداد","رد تأمين"].includes(p.type)?-1:1)*(+p.amount||0),0)}
function expenseFlow(method){return data.expenses.filter(e=>e.method===method).reduce((s,e)=>s+(+e.amount||0),0)}

function accountStat(label,value){return `<div class="card clickable account-stat" role="button" tabindex="0" onclick="showAccountDetail('${label}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showAccountDetail('${label}')}"><div class="muted">${label}</div><div class="num">${value}</div><div class="stat-hint">اضغط لعرض تفاصيل الحركة ←</div></div>`}
function showAccountDetail(label){
 let rows=[],heads=["التاريخ","البيان","رقم الحجز","المبلغ","الطريقة"];
 const payments=data.payments, expenses=data.expenses;
 if(label==="إجمالي المقبوض") rows=payments.filter(p=>["دفعة","استلام تأمين"].includes(p.type)).map(p=>[dt(p.date),p.type,data.bookings.find(b=>b.id===p.bookingId)?.number||"—",fmt(p.amount),p.method||"—"]);
 else if(label==="إجمالي المسترد") rows=payments.filter(p=>["استرداد","رد تأمين"].includes(p.type)).map(p=>[dt(p.date),p.type,data.bookings.find(b=>b.id===p.bookingId)?.number||"—",fmt(p.amount),p.method||"—"]);
 else if(label==="تأمينات مستلمة"||label==="تأمينات محتفظ بها") rows=payments.filter(p=>p.type==="استلام تأمين"&&(label!=="تأمينات محتفظ بها"||insuranceBalance(data.bookings.find(b=>b.id===p.bookingId)||{})>0)).map(p=>[dt(p.date),"استلام تأمين",data.bookings.find(b=>b.id===p.bookingId)?.number||"—",fmt(p.amount),p.method||"—"]);
 else if(label==="تأمينات مردودة") rows=payments.filter(p=>p.type==="رد تأمين").map(p=>[dt(p.date),"رد تأمين",data.bookings.find(b=>b.id===p.bookingId)?.number||"—",fmt(p.amount),p.method||"—"]);
 else if(label==="المصروفات") rows=expenses.map(x=>[dt(x.date),x.title+" ("+(x.category||"أخرى")+")","—",fmt(x.amount),x.method||"—"]);
 else if(label==="رصيد الخزنة"||label==="رصيد البنك"){
  let method=label==="رصيد الخزنة"?"نقدي":null;
  rows=payments.filter(p=>method?p.method===method:["تحويل","بطاقة"].includes(p.method)).map(p=>[dt(p.date),p.type,data.bookings.find(b=>b.id===p.bookingId)?.number||"—",( ["استرداد","رد تأمين"].includes(p.type)?"−":"+")+fmt(p.amount),p.method||"—"]);
  rows.push(...expenses.filter(x=>method?x.method===method:["تحويل","بطاقة"].includes(x.method)).map(x=>[dt(x.date),"مصروف: "+x.title,"—","−"+fmt(x.amount),x.method||"—"]));
 }
 else if(label==="تكلفة القماش") rows=data.dresses.filter(d=>+d.fabric>0).map(d=>["—",d.name||"فستان",d.code||"—",fmt(d.fabric),"—"]);
 else if(label==="إجمالي تكلفة الفساتين") rows=data.dresses.filter(d=>+d.buy>0).map(d=>["—",d.name||"فستان",d.code||"—",fmt(d.buy),"—"]);
 else if(label==="مستحقات الحجوزات") rows=data.bookings.filter(b=>b.status!=="ملغي"&&remaining(b)>0).map(b=>[dt(b.delivery),b.client,b.number,fmt(remaining(b)),"—"]);
 let body=rows.length?`<div class="tablewrap"><table><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`:`<div class="notice">لا توجد حركات مسجلة في هذا البند حالياً.</div>`;
 modal(`<h3>تفاصيل ${esc(label)}</h3><p class="muted">عدد الحركات: ${rows.length}</p>${body}<div class="row"><button class="alt" onclick="closeModal()">إغلاق</button></div>`);
}
function money(){let cash=(+data.settings.openingCash||0)+paymentFlow("نقدي")-expenseFlow("نقدي"),bank=(+data.settings.openingBank||0)+paymentFlow("تحويل")+paymentFlow("بطاقة")-expenseFlow("تحويل")-expenseFlow("بطاقة");let fabric=data.dresses.reduce((s,d)=>s+(+d.fabric||0),0),assets=data.dresses.reduce((s,d)=>s+(+d.buy||0),0),due=data.bookings.filter(b=>b.status!=="ملغي").reduce((s,b)=>s+Math.max(0,remaining(b)),0);return header("الحسابات والخزنة")+`<div class="row"><button onclick="expenseForm()">إضافة مصروف</button><button class="alt" onclick="page='reports';render()">التقارير والفلاتر</button><button class="alt" onclick="printHTML('<h2>ملخص الحسابات</h2>'+document.querySelector('.grid').innerHTML)">طباعة الملخص</button></div><div class="grid">${accountStat("إجمالي المقبوض",fmt(data.payments.filter(p=>["دفعة","استلام تأمين"].includes(p.type)).reduce((s,p)=>s+(+p.amount||0),0)))}${accountStat("إجمالي المسترد",fmt(data.payments.filter(p=>["استرداد","رد تأمين"].includes(p.type)).reduce((s,p)=>s+(+p.amount||0),0)))}${accountStat("تأمينات مستلمة",fmt(data.payments.filter(p=>p.type==="استلام تأمين").reduce((s,p)=>s+(+p.amount||0),0)))}${accountStat("تأمينات مردودة",fmt(data.payments.filter(p=>p.type==="رد تأمين").reduce((s,p)=>s+(+p.amount||0),0)))}${accountStat("تأمينات محتفظ بها",fmt(data.payments.filter(p=>p.type==="استلام تأمين").reduce((s,p)=>s+(+p.amount||0),0)-data.payments.filter(p=>p.type==="رد تأمين").reduce((s,p)=>s+(+p.amount||0),0)))}${accountStat("المصروفات",fmt(data.expenses.reduce((s,e)=>s+(+e.amount||0),0)))}${accountStat("رصيد الخزنة",fmt(cash))}${accountStat("رصيد البنك",fmt(bank))}${accountStat("تكلفة القماش",fmt(fabric))}${accountStat("إجمالي تكلفة الفساتين",fmt(assets))}${accountStat("مستحقات الحجوزات",fmt(due))}</div><div class="panel"><h3>الحركات المالية</h3><div class="tablewrap"><table><tr><th>التاريخ</th><th>الحركة</th><th>الحجز</th><th>المبلغ</th><th>الطريقة</th><th>إيصال</th></tr>${data.payments.map(p=>`<tr><td>${dt(p.date)}</td><td>${esc(p.type)}</td><td>${esc(data.bookings.find(b=>b.id===p.bookingId)?.number||"—")}</td><td>${fmt(p.amount)}</td><td>${esc(p.method)}</td><td><button class="alt" onclick="receipt('${p.id}')">طباعة</button></td></tr>`).join("")||'<tr><td colspan="6">لا توجد حركات</td></tr>'}</table></div></div><div class="panel"><h3>المصروفات</h3><div class="tablewrap"><table><tr><th>التاريخ</th><th>البيان</th><th>التصنيف</th><th>المبلغ</th><th>طريقة الدفع</th><th>إجراءات</th></tr>${data.expenses.map(x=>`<tr><td>${dt(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.category||"أخرى")}</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td><button onclick="expenseForm('${x.id}')">تعديل</button> <button class="danger" onclick="deleteExpense('${x.id}')">حذف</button></td></tr>`).join("")||'<tr><td colspan="6">لا توجد مصروفات</td></tr>'}</table></div></div>`}
function expenseForm(id){let x=data.expenses.find(e=>e.id===id)||{id:"",title:"",category:"أخرى",amount:"",date:today(),method:"نقدي",notes:""};modal(`<h3>${id?"تعديل مصروف":"مصروف جديد"}</h3><form id="ef">${field("بيان المصروف","title",x.title,true)}<div class="field"><label>التصنيف</label><select name="category">${["إيجار","كهرباء ومياه","صيانة","مغسلة","مستلزمات","تشغيل","أخرى"].map(v=>`<option ${v===x.category?"selected":""}>${v}</option>`).join("")}</select></div>${field("المبلغ","amount",x.amount,true,"number")}${field("التاريخ","date",x.date,true,"date")}<div class="field"><label>طريقة الدفع</label><select name="method">${["نقدي","تحويل","بطاقة"].map(v=>`<option ${v===x.method?"selected":""}>${v}</option>`).join("")}</select></div><div class="field wide"><label>ملاحظات</label><textarea name="notes">${esc(x.notes||"")}</textarea></div><button>حفظ</button></form>`);$("ef").onsubmit=async e=>{e.preventDefault();let v=new FormData(e.target),amount=+v.get("amount");if(amount<=0){alert("أدخل مبلغاً صحيحاً");return}let o={...x,id:x.id||uid(),title:v.get("title"),category:v.get("category"),amount,date:v.get("date"),method:v.get("method"),notes:v.get("notes")};if(x.id)data.expenses[data.expenses.findIndex(z=>z.id===x.id)]=o;else data.expenses.unshift(o);log(x.id?"تعديل مصروف":"إضافة مصروف","حسابات",o.id);await save();closeModal();render()}}
async function deleteExpense(id){if(!confirm("حذف المصروف نهائياً؟"))return;data.expenses=data.expenses.filter(x=>x.id!==id);log("حذف مصروف","حسابات",id);await save();render()}
function reports(){let from=today().slice(0,8)+"01",to=today();return header("التقارير")+`<div class="panel"><form id="reportFilter" class="formgrid" onsubmit="event.preventDefault();reportResults(this.from.value,this.to.value)">${field("من تاريخ","from",from,true,"date")}${field("إلى تاريخ","to",to,true,"date")}<button class="wide">عرض التقرير</button></form></div><div id="reportResults">${reportResultsHtml(from,to)}</div>`}
function reportResultsHtml(from,to){let bs=data.bookings.filter(b=>b.delivery>=from&&b.delivery<=to&&b.status!=="ملغي"),ps=data.payments.filter(p=>p.date>=from&&p.date<=to),es=data.expenses.filter(x=>x.date>=from&&x.date<=to),received=ps.filter(p=>p.type==="دفعة").reduce((s,p)=>s+(+p.amount||0),0),refund=ps.filter(p=>p.type==="استرداد").reduce((s,p)=>s+(+p.amount||0),0),spent=es.reduce((s,x)=>s+(+x.amount||0),0);return `<div class="muted">الفترة: ${dt(from)} إلى ${dt(to)}</div><div class="grid">${stat("عدد الحجوزات",bs.length)}${stat("قيمة الإيجارات",fmt(bs.reduce((s,b)=>s+(+b.rent||0),0)))}${stat("التحصيلات",fmt(received))}${stat("الاستردادات",fmt(refund))}${stat("المصروفات",fmt(spent))}${stat("صافي التدفق",fmt(received-refund-spent))}${stat("المتبقي على الحجوزات",fmt(bs.reduce((s,b)=>s+Math.max(0,remaining(b)),0)))}</div><div class="panel"><h3>الحجوزات</h3>${bs.map(b=>`<div class="alert">${esc(b.number)} — ${esc(b.client)} — ${esc(b.dressName)} — ${fmt(b.rent)}</div>`).join("")||"لا توجد حجوزات في الفترة"}</div>`}
function reportResults(from,to){$("reportResults").innerHTML=reportResultsHtml(from,to)}
function settings(){return header("الإعدادات")+`<div class="panel"><h3>حفظ واستعادة البيانات</h3><div class="row"><button class="gold" onclick="backup()">الاحتفاظ بنسخة احتياطية</button><button class="alt" onclick="document.getElementById('restore').click()">استعادة البيانات</button><input hidden id="restore" type="file" accept=".json" onchange="restoreData(event)"></div></div><div class="panel"><form id="sf">${field("اسم الأتيليه","name",data.settings.name,true)}${field("رقم الهاتف","phone",data.settings.phone)}${field("العنوان","address",data.settings.address)}${field("رصيد افتتاحي للخزنة","openingCash",data.settings.openingCash,false,"number")}${field("رصيد افتتاحي للبنك","openingBank",data.settings.openingBank,false,"number")}<div class="field wide"><label>شروط الفاتورة</label><textarea name="invoiceTerms">${esc(data.settings.invoiceTerms||"")}</textarea></div><button>حفظ الإعدادات</button></form></div><div class="panel"><h3>كلمة مرور حذف البيانات</h3><p class="muted">كلمة المرور محلية على هذا الجهاز لتأكيد مسح بيانات التشغيل.</p><form id="passForm"><div class="field"><label>كلمة المرور الجديدة</label><input name="newPass" type="password" required minlength="4"></div><div class="field"><label>تأكيد كلمة المرور</label><input name="confirmPass" type="password" required minlength="4"></div><button>حفظ كلمة المرور</button></form></div><div class="panel"><h3>مسح بيانات التشغيل</h3><p class="muted">سيتم تنزيل نسخة احتياطية أولاً، ثم حذف الفساتين والحجوزات والعميلات والحركات المالية، مع الاحتفاظ بإعدادات الأتيليه وكلمة المرور.</p><button class="danger" onclick="clearOperationalData()">مسح كل بيانات التشغيل</button></div><div class="notice">كل البيانات محفوظة داخل المتصفح على هذا الجهاز. إذا مسحت بيانات المتصفح أو حذفت بيانات الموقع فقد تفقد البيانات؛ احتفظ بنسخة احتياطية دورية.</div><div class="panel"><h3>سجل التعديلات الأخير</h3>${data.audit.slice(0,30).map(a=>`<div class="alert">${esc(a.action)} — ${esc(a.kind)} — ${new Date(a.at).toLocaleString("ar-EG")}</div>`).join("")||"لا يوجد سجل بعد"}</div>`}
$("app").addEventListener("submit",async e=>{if(e.target.id==="passForm"){e.preventDefault();let v=new FormData(e.target),a=v.get("newPass"),b=v.get("confirmPass");if(a.length<4||a!==b){alert("كلمة المرور يجب ألا تقل عن 4 أحرف ويجب أن يتطابق التأكيد.");return}data.settings.clearPassword=a;await save();alert("تم حفظ كلمة المرور.");e.target.reset()}if(e.target.id==="sf"){e.preventDefault();let v=new FormData(e.target);data.settings={...data.settings,name:v.get("name"),phone:v.get("phone"),address:v.get("address"),openingCash:+v.get("openingCash")||0,openingBank:+v.get("openingBank")||0,invoiceTerms:v.get("invoiceTerms")||""};$("brand").textContent=data.settings.name;await save();alert("تم حفظ الإعدادات")}})
function clearOperationalData(){let pass=prompt("أدخل كلمة مرور الحذف");if(pass===null)return;if(!data.settings.clearPassword){alert("عيّن كلمة مرور الحذف أولاً من الإعدادات.");return}if(pass!==data.settings.clearPassword){alert("كلمة المرور غير صحيحة.");return}if(!confirm("تأكيد أخير: سيتم حذف كل بيانات التشغيل. هل تريد المتابعة؟"))return;backup();let keep={...data.settings};data={...fresh(),settings:keep};save().then(()=>{alert("تم مسح بيانات التشغيل بعد تنزيل النسخة الاحتياطية.");page="home";render()}).catch(e=>alert("تعذر الحفظ: "+e.message))}
function invoiceMarkup(b){return `<div dir="rtl" style="font-family:Tahoma,Arial;padding:28px;color:#30272a;background:#fffdf9;max-width:720px;margin:auto;border:2px solid #542b38;border-radius:14px"><h1 style="color:#542b38">${esc(data.settings.name)}</h1><h2>فاتورة حجز</h2><p>رقم الحجز: ${esc(b.number)} — التاريخ: ${dt(today())}</p><p>العميلة: ${esc(b.client)} — الهاتف: ${esc(b.phone)}</p><p>الفستان: ${esc(b.dressName)} — الكود: ${esc(b.dressCode)}</p>${b.dressImage?`<img src="${b.dressImage}" style="max-width:180px;max-height:180px;object-fit:contain">`:""}${(b.dressAccessories||data.dresses.find(d=>d.id===b.dressId)?.accessories||"").trim()?`<p><b>ملحقات الفستان:</b> ${esc(b.dressAccessories||data.dresses.find(d=>d.id===b.dressId)?.accessories||"")}</p>`:""}<p>موعد التسليم: ${dt(b.delivery)} | موعد الإرجاع: ${dt(b.returnDate)}</p><hr><p>الإيجار: ${fmt(b.rent)}</p><p>التأمين: ${fmt(b.security)}</p><p>إجمالي المدفوع: ${fmt(totalPaid(b))}</p><p>المتبقي: ${fmt(remaining(b))}</p>${String(b.notes||"").trim()?`<p><b>ملاحظات الحجز:</b> ${esc(b.notes)}</p>`:""}<p>الشروط: ${esc(data.settings.invoiceTerms||"")}</p><hr><p>توقيع العميلة: .................... توقيع الأتيليه: ....................</p></div>`}

function invoiceCanvas(b){
 let im=null;
 return (async()=>{
  if(b.dressImage){im=await new Promise(resolve=>{let image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=b.dressImage})}
  let W=1200,lines=[],terms=String(data.settings.invoiceTerms||"").split(/\s+/).filter(Boolean),ctx,c=document.createElement("canvas"),accessoryText=String(b.dressAccessories||data.dresses.find(d=>d.id===b.dressId)?.accessories||"").trim(),noteText=String(b.notes||"").trim();c.width=W;
  let measure=c.getContext("2d");measure.font="30px Tahoma,Arial";let row="";
  for(const word of terms){let test=row?row+" "+word:word;if(measure.measureText(test).width>W-170&&row){lines.push(row);row=word}else row=test}
  if(row)lines.push(row);

  function line(t,size=36,bold=false,color="#30272a"){ctx.fillStyle=color;ctx.font=`${bold?"bold ":""}${size}px Tahoma,Arial`;ctx.fillText(String(t??""),x,y);y+=size+28}
  line(data.settings.name,58,true,"#542b38");line("فاتورة حجز",46,true);line("رقم الحجز: "+b.number);line("التاريخ: "+dt(today()));line("العميلة: "+b.client);line("الهاتف: "+(b.phone||"—"));line("الفستان: "+b.dressName+" — "+b.dressCode);if(accessoryText)line("ملحقات الفستان: "+accessoryText,32,true);line("موعد التسليم: "+dt(b.delivery));line("موعد الإرجاع: "+dt(b.returnDate));

function canvasBlob(canvas,type="image/jpeg",quality=.92){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("تعذر تجهيز ملف الفاتورة")),type,quality))}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}

async function invoicePDF(id){let b=data.bookings.find(x=>x.id===id);if(!b)return;try{let c=await invoiceCanvas(b),jpg=await canvasBlob(c),pdf=await jpegToPDF(jpg,c.width,c.height);downloadBlob(pdf,"Invoice-"+(b.number||"booking")+".pdf")}catch(e){alert(e.message||"تعذر إنشاء ملف PDF")}}
async function jpegToPDF(jpeg,width,height){
 let data=new Uint8Array(await jpeg.arrayBuffer()),pageW=595.28,pageH=841.89,scale=Math.min(pageW/width,pageH/height),drawW=width*scale,drawH=height*scale,left=(pageW-drawW)/2,bottom=(pageH-drawH)/2;
 const enc=s=>new TextEncoder().encode(s),chunks=[],offsets=[0];let length=0;
 const push=a=>{chunks.push(a);length+=a.length};
 const obj=(n,parts)=>{offsets[n]=length;push(enc(n+" 0 obj\n"));for(const part of parts)push(typeof part==="string"?enc(part):part);push(enc("\nendobj\n"))};
 push(enc("%PDF-1.4\n"));
 obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
 obj(2,["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
 obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
 obj(4,[`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${data.length} >>\nstream\n`,data,"\nendstream"]);
 let content=`q\n${drawW} 0 0 ${drawH} ${left} ${bottom} cm\n/Im0 Do\nQ\n`;
 obj(5,[`<< /Length ${enc(content).length} >>\nstream\n${content}endstream`]);
 let xref=length;push(enc("xref\n0 6\n0000000000 65535 f \n"));for(let i=1;i<=5;i++)push(enc(String(offsets[i]).padStart(10,"0")+" 00000 n \n"));push(enc(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
 return new Blob(chunks,{type:"application/pdf"});
}
